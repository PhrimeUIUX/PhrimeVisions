<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PhrimeUIUX | Enter The System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  </head>
  <body>
    <audio id="ambient-audio" src="./sounds/ambient-loop.mp3" loop preload="auto"></audio>
    <audio id="impact-audio" src="./sounds/impact-hit.mp3" preload="auto"></audio>
    <canvas id="grain" aria-hidden="true"></canvas>
    <div id="progress" aria-hidden="true"></div>
    <div id="cursor" aria-hidden="true"></div>

    <div class="start-gate" id="start-gate">
      <div class="start-wrap">
        <p class="start-eyebrow">PhrimeUIUX</p>
        <h1 class="start-title"><span>P</span><span>H</span><span>R</span><span>I</span><span>M</span><span>E</span></h1>
        <p class="start-copy">For teams that can afford to win.</p>
        <button class="start-btn" id="start-btn" type="button">Enter</button>
      </div>
    </div>

    <div id="preloader" hidden>
      <div class="loader-wrap">
        <p class="blink">Initializing PhrimeUIUX System...</p>
        <p class="blink">Loading Experience...</p>
        <div class="loader-line"></div>
      </div>
    </div>

    <div class="flash" id="flash"></div>

    <main id="experience" aria-label="PhrimeUIUX experience">
      <section class="section hero" id="hero">
        <div class="hero-scene-shell is-inactive" id="hero-scene-shell" aria-hidden="true">
          <video id="hero-video" autoplay muted loop playsinline preload="auto">
            <source src="https://assets.ppc-toda.com/phrimevisions/BG.mp4" type="video/mp4" />
          </video>
          <div class="hero-scene-vignette"></div>
        </div>
        <header class="hero-nav" data-reveal>
          <p>01 Index</p>
          <p>Film Production</p>
          <button class="hero-enter" id="explore-btn" type="button">Explore</button>
        </header>
        <div class="hero-core">
          <p class="hero-text" data-reveal>STORIES WORTH REMEMBERING.</p>
          <h2 class="hero-word" data-reveal>PHRIME VISIONS</h2>
          <button class="hero-cta" id="vision-cta" data-reveal type="button">
            <span class="hero-cta-mark" aria-hidden="true"></span>
            <span class="hero-cta-copy">
              <span class="hero-cta-label">Start a project</span>
              <span class="hero-cta-meta">Films with a pulse</span>
            </span>
            <span class="hero-cta-arrow" aria-hidden="true">
              <iconify-icon icon="hugeicons:arrow-up-right-01" width="20" height="20"></iconify-icon>
            </span>
          </button>
        </div>
        <footer class="hero-foot" data-reveal>
          <p>Film / Commercial / Documentary</p>
          <p>Visual Storytelling</p>
        </footer>
      </section>
    </main>

    <div class="slide-nav" id="slide-nav" hidden>
      <button id="prev-btn" type="button" disabled>Prev</button>
      <p>1 / 1</p>
      <button id="next-btn" type="button" disabled>Next</button>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
